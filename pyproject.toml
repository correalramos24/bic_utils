[project]
name = "py-utils"
version = "0.1.0"
description = "Python utils collection, on my own style."
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Victor Correal Ramos", email = "correal.ramos@gmail.com"} ]
requires-python = ">=3.7"
dependencies = ["termcolor", "f90nml", "PyYAML"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/utils"]